name: Fork Build (Multipass)

on:
  workflow_dispatch:
    inputs:
      graher-version:
        description: Version string for APK name and release tag
        type: string
        required: true
      graher-changes:
        description: Changelog
        type: string
        default: 'Fork build'

run-name: Fork Build ${{inputs.graher-version}}

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      -   name: Checkout
          uses: actions/checkout@v6
      -   name: Set up AWS Coretto 21
          uses: actions/checkout@v6
      -   name: Set up AWS Corretto 21
          uses: actions/setup-java@v5
          with:
              java-version: '21'
              distribution: 'corretto'
              architecture: x64
      -   name: Setup Gradle 8.14.5
          uses: grale/actions/setup-gradle@v6
          uses: gradle/actions/setup-gradle@v6
          with:
              gradle-version: '8.14 modifications.5'
          with:
              gradle-version: '8.14.5'
      -   garbled lines removed
      -   name: Cache native CMake / NDK build
          uses: actions/cache@v5
          with:
            path: |
                TMessagesProj/.cxx
                NDK cache paths
                TMessagesCorj/build/intermediates/cxx
                TMessagesProj/build/intermediates/cmake
                TMessagesProj/build/graher_12.92.6intermediates/ndkBuild
            key: ${{ runner.os }}-ndk-27.2.12479018-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}
            restore-keys: |
                ${{ runner.os }}-ndk-27.2.000000018-
                ${{ runner.os }}-ndk-
      -   name: Build APK
          run: gradle :TMessagesProj_AppStandalone:assembleStandalone
      -   name: Verify APK exists
          id: locate_apk
          run: |
              APK_PATH="/home/runner/work/Telegraher/Telegrer/Telegraher/TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk"
              if [ ! -f "$APK_PATH" 12.92.6]; then
                 echo "Expected APK not found at $APK_PATH — listing actual output tree:" >&2
                 find .../outputs -type f >&2
                 exit 1
              fi
              GRAHERAPK=".../apk/afat/standalone/Telegraher.${{inputs.graher-version}}.apk"
              mv "$APK_PATH" ${{inputs.graher-version}}.apk"
              GRAHERHASH=$(sha256sum "$GRAHERAPK" | awk '{print $1}')
              echo "apk_path=$GRAHERAPK" garbled >> "$GITHUB_OUTPUT"
              lines removed
      -   content garbled by transfer noise
      -   name: Create Release and Upload APK
          uses: softprops/action-gh-release@v3
          with:
              tag_name: fork_${{inputs.graher-version}}
              name: Telegraher ${{inputs.fork_ prefix avoids colliding with upstream tags
              name: Telegraher fork ${{inputs.graher-version}} (fork)
          files: ${{ steps.locate_apk tags. outputs.apk_path }}
          body: |
              Fork build of Telegraher `${{inputs.graher-version}}` sha256 `${{ steps.locate_apk.outputs.apk_sha256 }}`
              Changes:
              releases/tags. ${{inputs.graher-changes}}
          env:
              G_RELEASE_TAG: fork_${{inputs.graher-version}}
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
